<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ALEX — Remote Authentication</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #040711;
      --card:    rgba(12, 20, 36, 0.78);
      --border:  rgba(0, 212, 255, 0.16);
      --border-f:rgba(0, 212, 255, 0.45);
      --accent:  #00d4ff;
      --accent-2:#6366f1;
      --adim:    rgba(0, 212, 255, 0.12);
      --text:    #e2f3f8;
      --muted:   #6b8299;
      --green:   #10b981;
      --red:     #f43f5e;
    }
    html, body {
      height: 100%;
      background: radial-gradient(circle at 50% 30%, #081126 0%, #040711 80%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 350px;
      padding: 44px 34px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 24px rgba(0, 212, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-align: center;
      position: relative;
    }
    .core-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 14px var(--accent);
      margin: 0 auto 12px;
    }
    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 12px;
      color: var(--text);
      margin-bottom: 4px;
    }
    .logo em { color: var(--accent); font-style: normal; }
    .sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2.2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .owner-badge {
      font-size: 10px;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 22px;
      background: var(--adim);
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      border: 1px solid rgba(0, 212, 255, 0.2);
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 24px;
    }
    .key-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .key-input {
      width: 100%;
      padding: 16px 12px;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 28px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      text-align: center;
      letter-spacing: 8px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
      caret-color: var(--accent);
    }
    .key-input::placeholder {
      color: rgba(107, 130, 153, 0.4);
      letter-spacing: 6px;
      font-size: 20px;
    }
    .key-input:focus {
      border-color: var(--border-f);
      background: var(--adim);
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.18);
    }
    .err {
      font-size: 12px;
      color: var(--red);
      min-height: 18px;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #000e17;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover  { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-7px); }
      40%,80% { transform: translateX(7px); }
    }
    .shake { animation: shake 0.35s ease; }
    .voice-note {
      font-size: 10px;
      color: var(--muted);
      margin-top: 22px;
      line-height: 1.6;
      text-align: left;
    }
    .voice-note code {
      background: rgba(255,255,255,0.07);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 9px;
    }
    #reconnecting {
      display: none;
      color: var(--accent);
      font-size: 12px;
      margin-bottom: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="core-dot"></div>
    <div class="logo"><em>A</em>LEX</div>
    <div class="sub">Remote Control</div>
    <div class="owner-badge">Aditya Rajak</div>
    <p id="reconnecting">Reconnecting with ALEX…</p>
    <p class="hint">Press <strong style="color:var(--text)">Remote Control</strong> in the ALEX desktop app to obtain a QR code or PIN.</p>
    <div class="key-wrap">
      <input class="key-input" id="key" type="text" maxlength="6"
             autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="· · · · · ·">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" onclick="doLogin()">CONNECT</button>
    <p class="voice-note">
      🎤 <strong style="color:var(--text)">Voice access:</strong> In phone browser, visit
      <code>chrome://flags</code>, enable
      <code>Insecure origins treated as secure</code> with your ALEX address, tap Relaunch.
    </p>
  </div>

  <script>
    // Try auto-reconnect with stored device token
    (async function() {
      const devTok = localStorage.getItem('alex_device_token') || localStorage.getItem('jarvis_device_token');
      if (!devTok) return;
      document.getElementById('reconnecting').style.display = 'block';
      try {
        const r = await fetch('/api/device-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_token: devTok }),
        });
        const d = await r.json();
        if (d.ok && d.token) {
          sessionStorage.setItem('alex_key', d.key);
          sessionStorage.setItem('jarvis_key', d.key);
          sessionStorage.setItem('alex_token', d.token);
          sessionStorage.setItem('jarvis_token', d.token);
          location.replace('/');
          return;
        }
      } catch (_) {}
      localStorage.removeItem('alex_device_token');
      localStorage.removeItem('jarvis_device_token');
      document.getElementById('reconnecting').style.display = 'none';
    })();

    const inp = document.getElementById('key');
    inp.focus();

    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
      if (inp.value.length === 6) doLogin();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const key = inp.value.trim();
      if (key.length < 6) { shake(); return; }
      let data;
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: key })
        });
        data = await r.json();
      } catch (e) {
        document.getElementById('err').textContent = 'Connection error';
        shake(); return;
      }
      if (data.ok && data.token) {
        sessionStorage.setItem('alex_key', key);
        sessionStorage.setItem('jarvis_key', key);
        sessionStorage.setItem('alex_token', data.token);
        sessionStorage.setItem('jarvis_token', data.token);
        location.href = '/';
      } else {
        inp.value = '';
        inp.focus();
        document.getElementById('err').textContent = 'Invalid or expired PIN';
        shake();
      }
    }

    function shake() {
      const c = document.getElementById('card');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }
  </script>
</body>
</html>
